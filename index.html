
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarData - Gestão de Abastecimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      
      /* Reset para alinhar o campo de data corretamente em todos os navegadores */
      input[type="date"] {
        appearance: none;
        -webkit-appearance: none;
        min-height: 50px;
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.6;
        filter: invert(0.5);
      }

      /* Garante que o texto da data não suba ou desça desalinhado */
      input[type="date"]::-webkit-datetime-edit {
        display: flex;
        padding: 0;
      }

      input[type="date"]::-webkit-datetime-edit-fields-wrapper {
        padding: 0;
      }

      /* Esconde scrollbars feias mas mantém funcionalidade */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
